name: Tests

on:
  pull_request:
    branches: [main, docs/roadmap-ikono-bitrix-trazabilidad]
  push:
    branches:
      - main
      - feature/seguimientos-recordatorios

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build iKono test fixture
        run: node scripts/build-ikono-summary-preview.cjs

      - name: Run tests
        run: npm test
