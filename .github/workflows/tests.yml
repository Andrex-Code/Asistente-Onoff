name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - feature/seguimientos-recordatorios

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js 22
        uses: actions/setup-node@1e60f620b9541d1fb3ffac03f7b0b5c9f8a8ec2e
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run tests
        run: npm test
