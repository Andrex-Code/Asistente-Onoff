name: Mirror Traductor TryController

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source translator
        uses: actions/checkout@v4
        with:
          repository: Andrex-Code/Traductor-TryController
          ref: main
          path: source

      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: Andrex-Code/Asistente-Onoff
          ref: main
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace target with exact source contents
        run: |
          rsync -a --delete --exclude='.git/' source/ target/
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mirror Traductor-TryController main" || exit 0
          git push origin HEAD:main
